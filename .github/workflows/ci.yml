name: Validate application
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt -r requirements-training.txt
      - run: python -m pytest -q
      - run: docker build -t medical-cost-app .
      - name: Container smoke test
        run: |
          docker run -d --name medical-cost-app -p 8000:8000 medical-cost-app
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail http://localhost:8000/health; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then docker logs medical-cost-app; exit 1; fi
          curl --fail http://localhost:8000/ > /dev/null
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: pip install -r requirements-dev.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
  production:
    name: Verify public production release
    needs: [test, browser]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check deployed version, assets and prediction workflows
        run: python scripts/check_production.py
