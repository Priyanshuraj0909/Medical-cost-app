name: Validate application
on: [push, pull_request]
permissions:
  contents: read
  deployments: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt -r requirements-training.txt
      - run: python -m pytest -q
      - run: docker build -t medical-cost-app .
      - name: Container smoke test
        run: |
          docker run -d --name medical-cost-app -p 8000:8000 medical-cost-app
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail http://localhost:8000/health; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then docker logs medical-cost-app; exit 1; fi
          curl --fail http://localhost:8000/ > /dev/null
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: pip install -r requirements-dev.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
  production:
    name: Verify public production release
    needs: [test, browser]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check deployed version, assets and prediction workflows
        run: python scripts/check_production.py
      - name: Find the generated production link published by Vercel
        id: deployment
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data: deployments } = await github.rest.repos.listDeployments({
              owner, repo, sha: context.sha, environment: 'Production', per_page: 10
            });
            for (const deployment of deployments) {
              const { data: statuses } = await github.rest.repos.listDeploymentStatuses({
                owner, repo, deployment_id: deployment.id, per_page: 10
              });
              const ready = statuses.find(status => status.state === 'success' && status.environment_url);
              if (!ready) continue;
              const url = new URL(ready.environment_url);
              if (url.protocol !== 'https:' || !/^medical-cost-[a-z0-9]+-king-09\.vercel\.app$/.test(url.hostname) || url.username || url.password || url.port || url.pathname !== '/' || url.search || url.hash) {
                throw new Error('Unexpected generated production URL in deployment metadata.');
              }
              core.setOutput('url', url.origin);
              return;
            }
            throw new Error('No successful production deployment found for this commit.');
      - name: Verify generated production link requires no Vercel login
        env:
          PRODUCTION_DEPLOYMENT_URL: ${{ steps.deployment.outputs.url }}
        run: python scripts/check_production.py --url "$PRODUCTION_DEPLOYMENT_URL"
